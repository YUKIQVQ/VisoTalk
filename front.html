<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI视觉语音对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .main-content {
            display: flex;
            height: 600px;
            gap: 0;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #e0e0e0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .video-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .camera-video {
            width: 100%;
            height: 100%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            position: relative;
        }

        .camera-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #cameraPlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
        }

        .ai-video {
            width: 100%;
            height: 300px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .start-btn {
            background: #27ae60;
            color: white;
        }

        .stop-btn {
            background: #e74c3c;
            color: white;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user-message {
            background: #3498db;
            color: white;
            margin-left: auto;
        }

        .ai-message {
            background: #ecf0f1;
            color: #333;
            margin-right: auto;
        }

        .input-section {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        .send-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .status-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #27ae60;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .visual-analysis {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .visual-analysis h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 视觉语音对话助手</h1>
            <p>开启摄像头和麦克风，与AI进行视觉语音交互</p>
        </div>

        <div class="main-content">
            <!-- 左侧面板：摄像头 -->
            <div class="left-panel">
                <div class="video-section">
                    <div class="video-container">
                        <div class="camera-video" id="cameraVideo">
                            <video id="webcam" autoplay playsinline muted></video>
                            <div id="cameraPlaceholder">📹 摄像头画面<br><div style="margin-top: 10px; font-size: 14px; opacity: 0.7;">点击"开始"按钮启动摄像头</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：AI内容和聊天 -->
            <div class="right-panel">
                <div class="controls" style="padding: 20px; border-bottom: 1px solid #e0e0e0;">
                    <button class="control-btn start-btn" id="startBtn" aria-label="开始对话">▶️ 开始对话</button>
                    <button class="control-btn stop-btn" id="stopBtn" disabled aria-label="停止对话">⏹️ 停止对话</button>
                </div>

                <div class="status-indicator" style="padding: 15px; border-bottom: 1px solid #e0e0e0; background: white;">
                    <div class="status-dot" id="cameraStatus"></div>
                    <span>摄像头: <span id="cameraStatusText">未启动</span></span>
                    <div class="status-dot" id="micStatus"></div>
                    <span>麦克风: <span id="micStatusText">未启动</span></span>
                    <div class="status-dot" id="aiStatus"></div>
                </div>

                <div id="errorContainer" style="padding: 0 20px;"></div>

                <div class="visual-analysis" id="visualAnalysis" style="display: none; margin: 10px 20px;">
                    <h4>🔍 视觉分析结果</h4>
                    <div id="analysisContent"></div>
                </div>

                <div class="chat-section" style="flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px;">
                    <div class="chat-history" id="chatHistory" style="flex: 1; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; padding: 15px; background: white;">
                        <div class="message ai-message">
                            你好！我是AI助手，我已经准备好通过视觉和语音与你交流。请开启摄像头和麦克风开始对话。
                        </div>
                    </div>

                    <div class="input-section" style="display: flex; gap: 10px; padding: 10px 0;">
                        <input type="text" class="message-input" id="messageInput" placeholder="输入文字消息或按住说话按钮..." maxlength="500" aria-label="消息输入框">
                        <button class="send-btn" id="sendBtn" aria-label="发送消息">💬 发送</button>
                        <button class="send-btn" id="voiceBtn" aria-label="语音录制">🎤 说话</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const CONSTANTS = {
                MAX_MESSAGE_LENGTH: 500,
                VOICE_RECORD_DELAY: 3000,
                VISUAL_ANALYSIS_INTERVAL: 5000,
                BACKEND_URL: 'http://localhost:3000/api',
                VOICE_MESSAGES: [
                    "你好，我想知道今天天气怎么样？",
                    "你能帮我看看这个物体是什么吗？",
                    "我想聊聊关于科技的话题。",
                    "你觉得我的表情看起来开心吗？"
                ]
            };

            let isConversationActive = false;
            let isVoiceRecording = false;
            let pendingTimers = [];
            let visualAnalysisTimer = null;
            let mediaStream = null;
            let conversationHistory = [];

            function getElement(id) {
                return document.getElementById(id);
            }

            function showError(message) {
                const container = getElement('errorContainer');
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                container.appendChild(errorDiv);

                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }

            function updateStatus() {
                const cameraStatus = getElement('cameraStatus');
                const micStatus = getElement('micStatus');
                const aiStatus = getElement('aiStatus');
                const cameraStatusText = getElement('cameraStatusText');
                const micStatusText = getElement('micStatusText');

                if (isConversationActive) {
                    cameraStatus.classList.add('active');
                    micStatus.classList.add('active');
                    aiStatus.classList.add('active');
                    cameraStatusText.textContent = '运行中';
                    micStatusText.textContent = '监听中';
                } else {
                    cameraStatus.classList.remove('active');
                    micStatus.classList.remove('active');
                    aiStatus.classList.remove('active');
                    cameraStatusText.textContent = '未启动';
                    micStatusText.textContent = '未启动';
                }
            }

            function clearPendingTimers() {
                pendingTimers.forEach(timer => clearTimeout(timer));
                pendingTimers = [];

                if (visualAnalysisTimer) {
                    clearInterval(visualAnalysisTimer);
                    visualAnalysisTimer = null;
                }
            }

            function safeSetTimeout(callback, delay) {
                const timer = setTimeout(() => {
                    if (isConversationActive) {
                        callback();
                    }
                    const index = pendingTimers.indexOf(timer);
                    if (index > -1) {
                        pendingTimers.splice(index, 1);
                    }
                }, delay);
                pendingTimers.push(timer);
                return timer;
            }

            async function initCamera() {
                try {
                    const video = getElement('webcam');
                    const placeholder = getElement('cameraPlaceholder');

                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        },
                        audio: true
                    });

                    video.srcObject = mediaStream;
                    placeholder.style.display = 'none';

                    console.log('✅ 摄像头和麦克风已启动');
                    return true;
                } catch (error) {
                    console.error('摄像头启动失败:', error);
                    showError('无法访问摄像头或麦克风: ' + error.message);
                    return false;
                }
            }

            function stopCamera() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;

                    const video = getElement('webcam');
                    const placeholder = getElement('cameraPlaceholder');
                    video.srcObject = null;
                    placeholder.style.display = 'flex';

                    console.log('✅ 摄像头和麦克风已停止');
                }
            }

            async function captureFrame() {
                try {
                    const video = getElement('webcam');
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    return canvas.toDataURL('image/jpeg', 0.8);
                } catch (error) {
                    console.error('捕获视频帧失败:', error);
                    return null;
                }
            }

            async function analyzeVision() {
                if (!isConversationActive) return;

                try {
                    const imageBase64 = await captureFrame();
                    if (!imageBase64) return;

                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/vision/analyze-base64`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ imageBase64 })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    displayVisualAnalysis(data.analysis);

                    return data.analysis;
                } catch (error) {
                    console.error('视觉分析请求失败:', error);
                    return null;
                }
            }

            function displayVisualAnalysis(analysis) {
                if (!analysis) return;

                const analysisContent = getElement('analysisContent');

                try {
                    analysisContent.innerHTML = `
                        <p><strong>场景:</strong> ${analysis.scene || '未知'}</p>
                        <p><strong>类别:</strong> ${analysis.category || '未知'}</p>
                        <p><strong>检测到物体:</strong> ${analysis.objects?.map(o => o.name).join(', ') || '无'}</p>
                        <p><strong>人脸:</strong> ${analysis.faces?.detected ? `是 (${analysis.faces.count}个, 情绪: ${analysis.faces.emotions})` : '否'}</p>
                        <p><strong>标签:</strong> ${(analysis.tags || []).join(', ')}</p>
                        <p><strong>置信度:</strong> ${(analysis.confidence * 100).toFixed(1)}%</p>
                        <p><strong>处理时间:</strong> ${analysis.processingTime}ms</p>
                    `;
                    getElement('visualAnalysis').style.display = 'block';
                } catch (error) {
                    console.error('显示视觉分析失败:', error);
                }
            }

            async function startConversation() {
                if (isConversationActive) return;

                console.log('🔍 开始检查摄像头权限...');

                const cameraStarted = await initCamera();
                if (!cameraStarted) {
                    showError('请先允许摄像头和麦克风权限');
                    console.error('❌ 摄像头启动失败');
                    return;
                }

                console.log('✅ 摄像头已启动，开始对话');

                isConversationActive = true;
                updateStatus();
                getElement('startBtn').disabled = true;
                getElement('stopBtn').disabled = false;

                addMessage('ai', '你好！我已经开启视觉和语音识别功能，现在可以同时看到你和听到你说的话。请告诉我你想聊什么！');

                // 定期视觉分析
                visualAnalysisTimer = setInterval(() => {
                    analyzeVision();
                }, CONSTANTS.VISUAL_ANALYSIS_INTERVAL);

                console.log('✅ 对话已开始，使用通义千问AI');

                // 测试后端连接
                testBackendConnection();
            }

            async function testBackendConnection() {
                try {
                    console.log('🔍 测试后端连接...');
                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/health`);
                    const data = await response.json();
                    console.log('✅ 后端服务正常:', data);

                    // AI状态已在updateStatus中更新
                } catch (error) {
                    console.error('❌ 后端服务连接失败:', error);
                    showError('后端服务未启动，请先运行: npm start');
                }
            }

            function stopConversation() {
                if (!isConversationActive) return;

                isConversationActive = false;
                clearPendingTimers();
                stopCamera();
                updateStatus();
                getElement('startBtn').disabled = false;
                getElement('stopBtn').disabled = true;
                getElement('visualAnalysis').style.display = 'none';

                addMessage('ai', '对话已结束。如果你有任何问题，随时可以重新开始！');

                console.log('✅ 对话已停止');
            }

            function addMessage(sender, message) {
                if (!message || typeof message !== 'string') return;

                const chatHistory = getElement('chatHistory');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;
                messageDiv.textContent = message.trim();
                chatHistory.appendChild(messageDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;

                // 保存到历史记录
                conversationHistory.push({
                    sender: sender,
                    message: message.trim(),
                    timestamp: new Date().toISOString()
                });

                // 保留最近10条记录
                if (conversationHistory.length > 10) {
                    conversationHistory = conversationHistory.slice(-10);
                }
            }

            async function sendMessage() {
                if (!isConversationActive) return;

                const input = getElement('messageInput');
                const message = input.value.trim();

                if (!message) return;

                if (message.length > CONSTANTS.MAX_MESSAGE_LENGTH) {
                    showError('消息过长，请缩短后再发送');
                    return;
                }

                addMessage('user', message);
                input.value = '';

                try {
                    // 获取最新的视觉分析
                    const visionData = await analyzeVision();

                    // 调用后端AI API
                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            context: conversationHistory,
                            visionData: visionData
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();

                    if (data.success) {
                        addMessage('ai', data.message);
                    } else {
                        throw new Error('AI响应失败');
                    }
                } catch (error) {
                    console.error('发送消息失败:', error);
                    showError('AI响应失败: ' + error.message);
                }
            }

            function handleKeyPress(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            }

            function toggleVoiceRecording() {
                if (!isConversationActive) return;

                isVoiceRecording = !isVoiceRecording;
                const btn = getElement('voiceBtn');

                if (isVoiceRecording) {
                    btn.textContent = '🔴 录音中...';
                    btn.style.background = '#e74c3c';

                    // 模拟语音输入
                    safeSetTimeout(() => {
                        const voiceMessages = CONSTANTS.VOICE_MESSAGES;
                        const randomMessage = voiceMessages[Math.floor(Math.random() * voiceMessages.length)];

                        addMessage('user', randomMessage);

                        // 重置按钮状态
                        isVoiceRecording = false;
                        btn.textContent = '🎤 说话';
                        btn.style.background = '#667eea';
                    }, CONSTANTS.VOICE_RECORD_DELAY);
                } else {
                    btn.textContent = '🎤 说话';
                    btn.style.background = '#667eea';
                }
            }

            function initEventListeners() {
                getElement('startBtn').addEventListener('click', startConversation);
                getElement('stopBtn').addEventListener('click', stopConversation);
                getElement('sendBtn').addEventListener('click', sendMessage);
                getElement('voiceBtn').addEventListener('click', toggleVoiceRecording);
                getElement('messageInput').addEventListener('keypress', handleKeyPress);
            }

            function init() {
                updateStatus();
                initEventListeners();
                console.log('✅ AI视觉语音对话助手已初始化');
                console.log('🤖 AI提供商: 通义千问 (Qwen)');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
