<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI视觉语音对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .main-content {
            display: flex;
            height: 600px;
            gap: 0;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #e0e0e0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .video-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .camera-video {
            width: 100%;
            height: 100%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            position: relative;
        }

        .camera-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #cameraPlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
        }

        .ai-video {
            width: 100%;
            height: 300px;
            background: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .start-btn {
            background: #27ae60;
            color: white;
        }

        .stop-btn {
            background: #e74c3c;
            color: white;
        }

        .visual-analysis {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 20px;
            max-height: 150px;
            overflow: hidden;
            position: relative;
        }

        .visual-analysis h4 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .visual-analysis-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #856404;
            padding: 0;
        }

        .visual-analysis-toggle:hover {
            opacity: 0.7;
        }

        .visual-analysis.collapsed .analysis-content-wrapper {
            display: none;
        }

        .analysis-content-wrapper {
            max-height: 120px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
        }

        .analysis-content-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .analysis-content-wrapper::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        .analysis-content-wrapper::-webkit-scrollbar-thumb {
            background: rgba(133, 100, 4, 0.3);
            border-radius: 3px;
        }

        .analysis-content-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(133, 100, 4, 0.5);
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow: hidden;
            min-height: 0;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background: white;
            min-height: 0;
        }

        .chat-history::-webkit-scrollbar {
            width: 8px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-history::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            background: #f0f0f0;
            color: #333;
            margin-right: auto;
        }

        .input-section {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        .send-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .status-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #27ae60;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #c33;
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            margin: 0;
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Arial', sans-serif;
        }

        .form-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #d0d0d0;
        }

        .persona-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 20px;
            font-size: 14px;
            display: none;
        }

        .persona-display.active {
            display: block;
        }

        .persona-display strong {
            display: block;
            margin-bottom: 5px;
        }

        .persona-display .persona-text {
            opacity: 0.9;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 视觉语音对话助手</h1>
            <p>开启摄像头和麦克风，与AI进行视觉语音交互</p>
            <button class="settings-btn" id="settingsBtn" title="设置人设">⚙️</button>
        </div>

        <div class="main-content">
            <!-- 左侧面板：摄像头 -->
            <div class="left-panel">
                <div class="video-section">
                    <div class="video-container">
                        <div class="camera-video" id="cameraVideo">
                            <video id="webcam" autoplay playsinline muted></video>
                            <div id="cameraPlaceholder">📹 摄像头画面<br><div style="margin-top: 10px; font-size: 14px; opacity: 0.7;">点击"开始"按钮启动摄像头</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：AI内容和聊天 -->
            <div class="right-panel">
                <div class="controls" style="padding: 20px; border-bottom: 1px solid #e0e0e0;">
                    <button class="control-btn start-btn" id="startBtn" aria-label="开始对话">▶️ 开始对话</button>
                    <button class="control-btn stop-btn" id="stopBtn" disabled aria-label="停止对话">⏹️ 停止对话</button>
                </div>

                <div class="status-indicator" style="padding: 15px; border-bottom: 1px solid #e0e0e0; background: white;">
                    <div class="status-dot" id="cameraStatus"></div>
                    <span>摄像头: <span id="cameraStatusText">未启动</span></span>
                    <div class="status-dot" id="micStatus"></div>
                    <span>麦克风: <span id="micStatusText">未启动</span></span>
                    <div class="status-dot" id="aiStatus"></div>
                </div>

                <div id="errorContainer" style="padding: 0 20px;"></div>

                <div class="persona-display" id="personaDisplay">
                    <strong> AI人设：<span id="personaName"></span></strong>
                    <div class="persona-text" id="personaText"></div>
                </div>

                <div class="visual-analysis" id="visualAnalysis" style="display: none;">
                    <h4>
                        <span>📊 视觉分析结果</span>
                        <button class="visual-analysis-toggle" id="toggleVisualAnalysis" title="折叠/展开">▼</button>
                    </h4>
                    <div class="analysis-content-wrapper" id="analysisContentWrapper">
                        <div id="analysisContent"></div>
                    </div>
                </div>

                <div class="chat-section">
                    <div class="chat-history" id="chatHistory">
                        <div class="message ai-message" id="initialMessage">
                            你好！我是<span id="aiDisplayName">AI助手</span>，我已经准备好通过视觉和语音与你交流。请开启摄像头和麦克风开始对话。
                        </div>
                    </div>

                    <div class="input-section" style="display: flex; gap: 10px; padding: 10px 0;">
                        <input type="text" class="message-input" id="messageInput" placeholder="输入文字消息或按住说话按钮..." maxlength="500" aria-label="消息输入框">
                        <button class="send-btn" id="sendBtn" aria-label="发送消息">💬 发送</button>
                        <button class="send-btn" id="voiceBtn" aria-label="语音录制">🎤 说话</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ AI 人设配置</h2>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>

            <div class="form-group">
                <label for="aiNameInput">AI 名字</label>
                <input type="text" id="aiNameInput" placeholder="例如：小智、AI助手" maxlength="20">
                <div class="form-hint">给AI起一个你喜欢的名字（留空使用默认：AI助手）</div>
            </div>

            <div class="form-group">
                <label for="personaInput">主要人设</label>
                <textarea id="personaInput" placeholder="例如：你是一个友善的学习助手，擅长解答数学和科学问题..."></textarea>
                <div class="form-hint">描述AI的性格特点、专业领域和交流风格（留空使用默认人设）</div>
            </div>

            <button class="save-btn" id="saveSettingsBtn">💾 保存设置</button>
            <button class="reset-btn" id="resetSettingsBtn">🔄 恢复默认</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const CONSTANTS = {
                MAX_MESSAGE_LENGTH: 500,
                VISUAL_ANALYSIS_INTERVAL: 5000,
                BACKEND_URL: 'http://localhost:3000/api'
            };

            let isConversationActive = false;
            let isVoiceRecording = false;
            let pendingTimers = [];
            let visualAnalysisTimer = null;
            let mediaStream = null;
            let conversationHistory = [];
            let aiSettings = {
                name: 'AI助手',
                persona: ''
            };
            let recognition = null;
            let isRecognitionSupported = false;

            function getElement(id) {
                return document.getElementById(id);
            }

            function showError(message) {
                const container = getElement('errorContainer');
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                container.appendChild(errorDiv);

                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }

            function updateStatus() {
                const cameraStatus = getElement('cameraStatus');
                const micStatus = getElement('micStatus');
                const aiStatus = getElement('aiStatus');
                const cameraStatusText = getElement('cameraStatusText');
                const micStatusText = getElement('micStatusText');

                if (isConversationActive) {
                    cameraStatus.classList.add('active');
                    micStatus.classList.add('active');
                    aiStatus.classList.add('active');
                    cameraStatusText.textContent = '运行中';
                    micStatusText.textContent = '监听中';
                } else {
                    cameraStatus.classList.remove('active');
                    micStatus.classList.remove('active');
                    aiStatus.classList.remove('active');
                    cameraStatusText.textContent = '未启动';
                    micStatusText.textContent = '未启动';
                }
            }

            function loadSettings() {
                const saved = localStorage.getItem('aiSettings');
                if (saved) {
                    try {
                        aiSettings = JSON.parse(saved);
                        console.log('✅ 已加载AI设置:', aiSettings);
                        updateAIDisplayName();
                    } catch (e) {
                        console.error('加载设置失败:', e);
                    }
                } else {
                    updateAIDisplayName();
                }
            }

            function updateAIDisplayName() {
                const displayName = getElement('aiDisplayName');
                if (displayName) {
                    displayName.textContent = aiSettings.name;
                }

                const pageTitle = document.querySelector('title');
                if (pageTitle) {
                    pageTitle.textContent = `${aiSettings.name} - AI视觉语音对话助手`;
                }
            }

            function saveSettings() {
                localStorage.setItem('aiSettings', JSON.stringify(aiSettings));
                console.log('✅ AI设置已保存:', aiSettings);
            }

            function resetSettings() {
                aiSettings = {
                    name: 'AI助手',
                    persona: ''
                };
                localStorage.removeItem('aiSettings');
                console.log('✅ AI设置已重置为默认值');
            }

            function openSettingsModal() {
                const modal = getElement('settingsModal');
                const aiNameInput = getElement('aiNameInput');
                const personaInput = getElement('personaInput');

                aiNameInput.value = aiSettings.name === 'AI助手' ? '' : aiSettings.name;
                personaInput.value = aiSettings.persona;

                modal.classList.add('active');
            }

            function closeSettingsModal() {
                const modal = getElement('settingsModal');
                modal.classList.remove('active');
            }

            function handleSaveSettings() {
                const aiNameInput = getElement('aiNameInput').value.trim();
                const personaInput = getElement('personaInput').value.trim();

                aiSettings.name = aiNameInput || 'AI助手';
                aiSettings.persona = personaInput;

                saveSettings();
                closeSettingsModal();
                updateAIDisplayName();

                let message = `✅ 设置已保存！AI名字：${aiSettings.name}`;
                if (aiSettings.persona) {
                    message += `\n人设：${aiSettings.persona.substring(0, 30)}...`;
                }
                showError(message);
            }

            function handleResetSettings() {
                if (confirm('确定要恢复默认设置吗？')) {
                    resetSettings();
                    getElement('aiNameInput').value = '';
                    getElement('personaInput').value = '';
                    updateAIDisplayName();
                    updatePersonaDisplay();
                    showError('✅ 已恢复默认设置');
                }
            }

            function clearPendingTimers() {
                pendingTimers.forEach(timer => clearTimeout(timer));
                pendingTimers = [];
            }

            function safeSetTimeout(callback, delay) {
                const timer = setTimeout(() => {
                    if (isConversationActive) {
                        callback();
                    }
                    const index = pendingTimers.indexOf(timer);
                    if (index > -1) {
                        pendingTimers.splice(index, 1);
                    }
                }, delay);
                pendingTimers.push(timer);
                return timer;
            }

            async function initCamera() {
                try {
                    const video = getElement('webcam');
                    const placeholder = getElement('cameraPlaceholder');

                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        },
                        audio: true
                    });

                    video.srcObject = mediaStream;
                    placeholder.style.display = 'none';

                    console.log('✅ 摄像头和麦克风已启动');
                    return true;
                } catch (error) {
                    console.error('摄像头启动失败:', error);
                    showError('无法访问摄像头或麦克风: ' + error.message);
                    return false;
                }
            }

            function stopCamera() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;

                    const video = getElement('webcam');
                    const placeholder = getElement('cameraPlaceholder');
                    video.srcObject = null;
                    placeholder.style.display = 'flex';

                    console.log('✅ 摄像头和麦克风已停止');
                }
            }

            async function captureFrame() {
                try {
                    const video = getElement('webcam');
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    return canvas.toDataURL('image/jpeg', 0.8);
                } catch (error) {
                    console.error('捕获视频帧失败:', error);
                    return null;
                }
            }

            async function analyzeVision() {
                if (!isConversationActive) return;

                try {
                    const imageBase64 = await captureFrame();
                    if (!imageBase64) return;

                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/vision/analyze-base64`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ imageBase64 })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    displayVisualAnalysis(data.analysis);

                    return data.analysis;
                } catch (error) {
                    console.error('视觉分析请求失败:', error);
                    return null;
                }
            }

            function displayVisualAnalysis(analysis) {
                if (!analysis) return;

                const visualAnalysis = getElement('visualAnalysis');
                const analysisContent = getElement('analysisContent');

                try {
                    const actualAnalysis = analysis.analysis || analysis;
                    const metadata = analysis.metadata || {};

                    const confidence = actualAnalysis.confidence !== undefined ? actualAnalysis.confidence :
                                     (metadata.confidence !== undefined ? metadata.confidence : 0.88);
                    const processingTime = analysis.processingTime || actualAnalysis.processingTime || 0;
                    const scene = actualAnalysis.scene || '未知';
                    const category = actualAnalysis.category || '未知';
                    const objects = actualAnalysis.objects || [];
                    const faces = actualAnalysis.faces || { detected: false };
                    const tags = actualAnalysis.tags || [];
                    const description = actualAnalysis.description || '';

                    let html = `
                        <p><strong>场景:</strong> ${scene}</p>
                        <p><strong>类别:</strong> ${category}</p>
                        <p><strong>检测到物体:</strong> ${objects.map(o => o.name).join(', ') || '无'}</p>
                        <p><strong>人脸:</strong> ${faces.detected ? `是 (${faces.count}个, 情绪: ${faces.emotions})` : '否'}</p>
                        <p><strong>标签:</strong> ${tags.join(', ') || '无'}</p>
                    `;

                    if (description) {
                        html += `<p><strong>描述:</strong> ${description.substring(0, 150)}${description.length > 150 ? '...' : ''}</p>`;
                    }

                    html += `<p><strong>置信度:</strong> ${(confidence * 100).toFixed(1)}%</p>`;

                    if (processingTime > 0) {
                        html += `<p><strong>处理时间:</strong> ${processingTime}ms</p>`;
                    }

                    if (analysis.analysisSource) {
                        html += `<p><strong>分析来源:</strong> ${analysis.analysisSource === 'cloud-qwen-vl' ? '🌐 云端AI' : '💻 本地分析'}</p>`;
                    }

                    analysisContent.innerHTML = html;
                    visualAnalysis.style.display = 'block';

                    visualAnalysis.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } catch (error) {
                    console.error('显示视觉分析失败:', error);
                    analysisContent.innerHTML = '<p style="color: red;">❌ 解析视觉分析数据失败</p>';
                    visualAnalysis.style.display = 'block';
                }
            }

            function toggleVisualAnalysis() {
                const visualAnalysis = getElement('visualAnalysis');
                const toggleBtn = getElement('toggleVisualAnalysis');

                visualAnalysis.classList.toggle('collapsed');

                if (visualAnalysis.classList.contains('collapsed')) {
                    toggleBtn.textContent = '▶';
                    toggleBtn.title = '展开';
                } else {
                    toggleBtn.textContent = '▼';
                    toggleBtn.title = '折叠';
                }
            }

            async function startConversation() {
                if (isConversationActive) return;

                console.log('🔍 开始检查摄像头权限...');
                console.log('🎭 当前AI设置:', JSON.stringify(aiSettings));

                const cameraStarted = await initCamera();
                if (!cameraStarted) {
                    showError('请先允许摄像头和麦克风权限');
                    console.error(' 摄像头启动失败');
                    return;
                }

                console.log('✅ 摄像头已启动，开始对话');

                isConversationActive = true;
                updateStatus();
                getElement('startBtn').disabled = true;
                getElement('stopBtn').disabled = false;

                let greeting = `你好！我是${aiSettings.name}`;
                if (aiSettings.persona) {
                    greeting += `，${aiSettings.persona.split('\n')[0].substring(0, 50)}`;
                }
                greeting += `，我已经开启视觉和语音识别功能，现在可以同时看到你和听到你说的话。请告诉我你想聊什么！`;

                addMessage('ai', greeting);

                // 定期视觉分析
                visualAnalysisTimer = setInterval(() => {
                    analyzeVision();
                }, CONSTANTS.VISUAL_ANALYSIS_INTERVAL);

                console.log('✅ 对话已开始，使用通义千问AI');

                // 测试后端连接
                testBackendConnection();
            }

            async function testBackendConnection() {
                try {
                    console.log('🔍 测试后端连接...');
                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/health`);
                    const data = await response.json();
                    console.log('✅ 后端服务正常:', data);

                    // AI状态已在updateStatus中更新
                } catch (error) {
                    console.error('❌ 后端服务连接失败:', error);
                    showError('后端服务未启动，请先运行: npm start');
                }
            }

            function stopConversation() {
                if (!isConversationActive) return;

                isConversationActive = false;
                clearPendingTimers();
                stopCamera();
                updateStatus();
                getElement('startBtn').disabled = false;
                getElement('stopBtn').disabled = true;
                getElement('visualAnalysis').style.display = 'none';

                const farewell = `${aiSettings.name}：对话已结束。如果你有任何问题，随时可以重新开始！`;
                addMessage('ai', farewell);

                console.log('✅ 对话已停止');
            }

            function addMessage(sender, message) {
                if (!message || typeof message !== 'string') return;

                const chatHistory = getElement('chatHistory');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;
                messageDiv.textContent = message.trim();
                chatHistory.appendChild(messageDiv);

                // 自动滚动到底部
                setTimeout(() => {
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }, 100);

                // 保存到历史记录
                conversationHistory.push({
                    sender: sender,
                    message: message.trim(),
                    timestamp: new Date().toISOString()
                });

                // 保留最近50条记录
                if (conversationHistory.length > 50) {
                    conversationHistory = conversationHistory.slice(-50);
                }
            }

            async function sendMessage() {
                if (!isConversationActive) return;

                const input = getElement('messageInput');
                const message = input.value.trim();

                if (!message) return;

                if (message.length > CONSTANTS.MAX_MESSAGE_LENGTH) {
                    showError('消息过长，请缩短后再发送');
                    return;
                }

                addMessage('user', message);
                input.value = '';

                console.log('📤 发送消息:', message);
                console.log('🎭 当前AI设置:', JSON.stringify(aiSettings));

                try {
                    // 检查用户是否提及了视觉相关内容
                    const needsVisionAnalysis = checkIfNeedsVision(message);

                    let visionData = null;
                    if (needsVisionAnalysis) {
                        console.log('️ 检测到需要视觉分析，开始捕获...');
                        visionData = await analyzeVision();
                    } else {
                        console.log('💬 普通对话，不使用视觉分析');
                    }

                    // 调用后端AI API
                    const response = await fetch(`${CONSTANTS.BACKEND_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            context: conversationHistory,
                            visionData: visionData,
                            aiSettings: aiSettings
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('📥 AI响应:', data);

                    if (data.success) {
                        addMessage('ai', data.message);
                    } else {
                        throw new Error('AI响应失败');
                    }
                } catch (error) {
                    console.error('发送消息失败:', error);
                    showError('AI响应失败: ' + error.message);
                }
            }

            function checkIfNeedsVision(message) {
                const visionKeywords = [
                    '摄像头', '看到', '看见', '画面', '环境', '周围',
                    '我在做什么', '我在哪里', '我旁边', '我手上',
                    '你能看到', '你看到什么', '识别', '分析',
                    'describe', 'see', 'look', 'view', 'camera'
                ];

                const lowerMessage = message.toLowerCase();
                return visionKeywords.some(keyword => lowerMessage.includes(keyword));
            }

            function handleKeyPress(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            }

            function initSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.lang = 'zh-CN';

                    recognition.onresult = function(event) {
                        const transcript = event.results[0][0].transcript;
                        console.log('✅ 语音识别结果:', transcript);

                        if (transcript.trim()) {
                            addMessage('user', transcript);
                            getElement('messageInput').value = transcript;

                            safeSetTimeout(() => {
                                sendMessage();
                            }, 500);
                        }

                        resetVoiceButton();
                    };

                    recognition.onerror = function(event) {
                        console.error('语音识别错误:', event.error);
                        let errorMsg = '语音识别失败';

                        switch(event.error) {
                            case 'no-speech':
                                errorMsg = '未检测到语音，请重试';
                                break;
                            case 'audio-capture':
                                errorMsg = '无法访问麦克风';
                                break;
                            case 'not-allowed':
                                errorMsg = '麦克风权限被拒绝';
                                break;
                            case 'network':
                                errorMsg = '网络连接错误';
                                break;
                        }

                        showError(errorMsg);
                        resetVoiceButton();
                    };

                    recognition.onend = function() {
                        if (isVoiceRecording) {
                            resetVoiceButton();
                        }
                    };

                    isRecognitionSupported = true;
                    console.log('✅ 语音识别已初始化');
                } else {
                    console.warn('⚠️ 浏览器不支持语音识别，请使用Chrome或Edge浏览器');
                    isRecognitionSupported = false;
                }
            }

            function resetVoiceButton() {
                isVoiceRecording = false;
                const btn = getElement('voiceBtn');
                btn.textContent = '🎤 说话';
                btn.style.background = '#667eea';
            }

            function toggleVoiceRecording() {
                if (!isConversationActive) return;

                if (!isRecognitionSupported) {
                    showError('您的浏览器不支持语音识别，请使用Chrome或Edge浏览器');
                    return;
                }

                if (!isVoiceRecording) {
                    try {
                        recognition.start();
                        isVoiceRecording = true;
                        const btn = getElement('voiceBtn');
                        btn.textContent = '🔴 录音中...';
                        btn.style.background = '#e74c3c';
                        console.log('🎤 开始录音...');
                    } catch (error) {
                        console.error('启动语音识别失败:', error);
                        showError('语音识别启动失败，请检查麦克风权限');
                        resetVoiceButton();
                    }
                } else {
                    try {
                        recognition.stop();
                        console.log('⏹️ 停止录音');
                    } catch (error) {
                        console.error('停止语音识别失败:', error);
                    }
                    resetVoiceButton();
                }
            }

            function initEventListeners() {
                getElement('startBtn').addEventListener('click', startConversation);
                getElement('stopBtn').addEventListener('click', stopConversation);
                getElement('sendBtn').addEventListener('click', sendMessage);
                getElement('voiceBtn').addEventListener('click', toggleVoiceRecording);
                getElement('messageInput').addEventListener('keypress', handleKeyPress);
                getElement('settingsBtn').addEventListener('click', openSettingsModal);
                getElement('closeSettingsBtn').addEventListener('click', closeSettingsModal);
                getElement('saveSettingsBtn').addEventListener('click', handleSaveSettings);
                getElement('resetSettingsBtn').addEventListener('click', handleResetSettings);
                getElement('toggleVisualAnalysis').addEventListener('click', toggleVisualAnalysis);

                // 点击弹窗外部关闭
                getElement('settingsModal').addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeSettingsModal();
                    }
                });
            }

            function init() {
                loadSettings();
                initSpeechRecognition();
                updateStatus();
                initEventListeners();
                console.log('✅ AI视觉语音对话助手已初始化');
                console.log('🤖 AI提供商: 通义千问 (Qwen)');
                console.log(`🤖 AI名字: ${aiSettings.name}`);
                console.log(`🎤 语音识别: ${isRecognitionSupported ? '已启用' : '不支持'}`);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
